<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Isometric grid - </title>
        <Link rel ="stylesheet" href ="style.css"> 
    </head>
    <body>
        <div class ="sidebar"> 
            <h1>Zomboid base builder</h1>
            <div class = "topnav">
                <a class = active href = "#home">Home</a>
                <a href = "#about">About</a>
                <a href = "#contact">Contact</a>
                <input type ="text" placeholder = "Search..">

                <div class ="items-category">  
                    <h2>Item Category</h2>
                    <!-- tab links-->
                    <button class = "tablinks" onclick = "switchCategory(event, 'Furniture')">Furniture</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Walls')">Walls</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Floors')">Floors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Doors')">Doors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Windows')">Windows</button>
                </div>
                <!-- category content -->
                <div id = "Furniture" class = "tabcontent"></div>
                <div id = "Walls" class = "tabcontent"></div>
                <div id = "Floors" class = "tabcontent"></div>
                <div id = "Doors" class = "tabcontent"></div>
                <div id = "Windows" class = "tabcontent"></div>
        </div>

        </div>
        <div class ='view-container'>
            <div class = "iso-container" id = "grid"></div>
        </div>
        <script src = "script.js"></script>
    </body>
</html>
