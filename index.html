<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Isometric grid - </title>
        <Link rel ="stylesheet" href ="style.css"> 
    </head>
    <body>
        <aside class ="sidebar"> 
            <h1>Zomboid base builder</h1>

            <nav class = "topnav">
                <input type ="text" name ="searchBar" id="searchBar"  placeholder = "Search..">
                <input class = "change-grid-size" name = "gridSizeChange" type = "number" id = "gridSizeInput" placeholder = "change grid side ">

                <section class ="items-category">  
                    <h2>Item Category</h2>
                    <!-- tab links-->
                    <button class = "tablinks" onclick = "switchCategory(event, 'Furniture')">Furniture</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Walls')">Walls</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Floors')">Floors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Doors')">Doors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Windows')">Windows</button>
                </section>
                <!-- category content -->
                <div class = 'item-category-content'>
                    <div id = "Furniture" class = "tabcontent"></div>
                    <div id = "Walls" class = "tabcontent"></div>
                    <div id = "Floors" class = "tabcontent"></div>
                    <div id = "Doors" class = "tabcontent"></div>
                    <div id = "Windows" class = "tabcontent"></div>
                </div>
            </nav>
        </aside>

        <div class ='view-container'>
            <div class = "iso-container" id = "grid"></div>
        </div>

        <nav class = "tools-bar">
                <button id = "rotateButton">Rotate</button>
                <button id = "deleteButton">Delete</button>
                <button id = "undoButton">Undo</button>
                <button id = "redoButton">Redo</button>
                <button id = "placeButton">Place</button>
        </nav>

        <script src = "itemDatabase.js"></script>
        <script src = 'CameraView.js'></script>
        <script src = "script.js"></script>
        <script src = "tools_bar_function.js"></script>
        <script src = "search_bar_items_list.js"></script>
    </body>
</html>
