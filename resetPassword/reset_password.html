<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Reset Password</title>
        <link rel = "stylesheet" href = "reset_password.css">
    </head>

    <body>
        <div class = "reset-password-box">
            <h2> set a new password</h2>

            <form id = "reset-password-form">
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" name="new-password" required>

                <label for = "confirm-password-input">Confirm Password:</label>
                <input type="password" id="confirm-password-input" name="confirm-password" required>

                <button type = "submit" id = "reset-password-submit-btn"> Update password </button>
                <p id = "reset-password-message"></p>
            </form>
        </div>
        <script type="module" src="../sb_stuff/supabase_client.js"></script>
        <script type="module" src = "reset_password.js"></script>

        
    </body>
</html>
