<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Reset Password</title>
        <link rel = "stylesheet" href = "reset_password.css">
    </head>

    <body>
        <div class = "reset-password-box">
            <button type = "button" id = "close-reset-password-btn" class = "close-reset-password-btn">X</button>
            <h2>Reset your password</h2>

            <section id = "step-email-section">
                <form id = "email-input-form">
                    <label for ="reset-email-input">Email:</label>
                    <input type = "email" id = "reset-email-input" placeholder = "you@example.com" required>

                    <button type = "submit" id = "send-link-btn">send reset link</button>
                    <p id = "reset-email-message"></p>
                </form>
            </section>

            <div id = "reset-password-section" style = "display: none;">
                <form id = "reset-password-form">
                    <label for="new-password">New Password:</label>
                    <input type="password" id="new-password" name="new-password" required>
                    
                    <label for = "confirm-password-input">Confirm Password:</label>
                    <input type="password" id="confirm-password-input" name="confirm-password" required>
                    <button type = "submit" id = "reset-password-submit-btn"> Update password </button>
                    <p id = "reset-password-message"></p>
            </form>
            </div>

        </div>
        <script type="module" src="../sb_stuff/supabase_client.js"></script>
        <script type="module" src = "reset_password.js"></script>

        
    </body>
</html>
