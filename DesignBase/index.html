<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Isometric grid - </title>
        <Link rel ="stylesheet" href ="style.css"> 
    </head>
    <body>
        <aside class ="sidebar"> 
            <h1>Zomboid base builder</h1>

                <div class = "user-icon-container"> 
                    <a href = "../login/login.html">
                        <div class = "user-avatar">
                            <svg id = "defaultAvatar" viewBox = "0 0 24 24" fill = "none" xmlns = "http://www.w3.org/2000/svg">
                                <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="#555555"/>
                            </svg>
                            <img id = "UserAvatarIMG" alt = "Account" style = "display:none">
                        </div>
                    </a>
                </div>
  
            <div class = "return-home-button">
                <a href = "../Home/Home.html">
                    <button id = 'returnHomeButton'>Return Home</button>
                </a>

            <nav class = "topnav">
                <input type ="text" name ="searchBar" id="searchBar"  placeholder = "Search..">
                <input class = "change-grid-size" name = "gridSizeChange" type = "number" id = "gridSizeInput" placeholder = "change grid side ">
                <section class ="items-category">  
                    <h2>Item Category</h2>
                    <!-- tab links-->
                    <button class = "tablinks" onclick = "switchCategory(event, 'Furniture')">Furniture</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Walls')">Walls</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Floors')">Floors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Doors')">Doors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Windows')">Windows</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Storage')">Storage</button>
                </section>
                <!-- category content -->
                <div class = 'item-category-content'>
                    <div id = "Furniture" class = "tabcontent"></div>
                    <div id = "Walls" class = "tabcontent"></div>
                    <div id = "Floors" class = "tabcontent"></div>
                    <div id = "Doors" class = "tabcontent"></div>
                    <div id = "Windows" class = "tabcontent"></div>
                    <div id = "Storage" class = "tabcontent"></div>
                </div>
                <div class = "floor-layer-changer">
                    <h2> Floor layer</h2>
                    <div class ="layer-toolbar">    
                        <button id = "moveUpFloorLayer">Move up</button>
                        <button id = "moveDownFloorLayer">Move down</button>
                        <button id = "addNewLayer">Add new layer</button>
                        <button id = "deleteLayer">Delete layer</button>
                    </div>

                    <div class = "Layer-list" id = "LayerList">
                        <div class = "Layer-list-item active" data-layer-index = "0">Layer 0</div>
                    </div>
                </div>

                <div class = "save-design-as-json"> 
                    <button id = "saveDesignButton" onclick="downloadBaseDesignAsJson()">Save Design as JSON</button>
                    <button id="loadDesignButton" onclick="loadBaseDesignFromJson()">Load Design from JSON</button>

                    <button id = "saveDesignToSupabaseButton" onclick="saveCurrentBaseDesignToSupabase()">Save Design Online</button>
                </div>
            </nav>
        </aside>


        <div class ='view-container'>
            <!--base design name-->
            <div class = 'base-design-name'>
                <h2 id = "designBaseName" contenteditable = "true">My Base</h2>
            </div>
            
            <div class = "iso-container" id = "grid"></div>
        </div>

        <nav class = "tools-bar">
                <button id = "rotateButton">Rotate</button>
                <button id = "deleteButton">Delete</button>
                <button id = "undoButton">Undo</button>
                <button id = "redoButton">Redo</button>
                <button id = "placeButton">Place</button>
                <button id = "placeDirectionButton">Place Direction:</button>

        </nav>

        <script src = "itemDatabase.js"></script>
        <script src = 'CameraView.js'></script>
        <script src = "create_grid.js"></script>

        <script src = "Large_Wall_data_with_spirte.js"></script>
        <script src = "Meddium_Wall_data_with_spirte.js"></script>
        <script src = "Small_Wall_data_with_spirte.js"></script>
        <script src = "wallSpriteLoader.js"></script>
        <script src = "Wall_placement.js"></script>

        <script src = 'btn_mouse_Ui_stuff.js'></script>

        <script src = "tools_bar_function.js"></script>

        <script src = "search_bar_items_list.js"></script>

        <script src = "cubeSpriteData.js"></script>
        <script src = "cubeSpriteLoader.js"></script>
        <script src = "cube.js"></script>

        <script src = "FloorControllLayer.js"></script>
        <script src = "saveCurrentBaseDesignFor_loadExistingBaseDesign.js"></script>
        <script src = "loadExistingBaseDesign.js"></script>

        <script src = "download_base_design.js"></script>
        <script src = ../login/updateUserAvatarAsSignIN.js></script>



        <script type="module" src="../sb_stuff/supabase_client.js"></script>
        <script type="module" src="../login/updateUserAvatarAsSignIN.js"></script>
        <script src = "save_design_to_supabase.js"></script>
    </body>
</html>
