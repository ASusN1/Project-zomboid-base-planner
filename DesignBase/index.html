<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Isometric grid - </title>
        <link rel ="stylesheet" href ="style.css"> 
        <link rel = "stylesheet" href = "cube_wall_stuff.css">
    </head>
    <body>
        <aside class ="sidebar"> 
            <h1>Zomboid base builder</h1>

                <div class = "user-icon-container"> 
                    <div class = "user-avatar">
                        <svg id = "defaultAvatar" viewBox = "0 0 24 24" fill = "none" xmlns = "http://www.w3.org/2000/svg">
                            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="#555555"/>
                        </svg>
                        <img id = "UserAvatarIMG" alt = "Account" style = "display:none">
                    </div>
                </div>
  
            <div class = "return-home-button">
                <a href = "../Home/Home.html">
                    <button id = 'returnHomeButton'>
                        <img src = "../HUD_icon/home_icon_stuff.png" alt = "Return Home">
                        Return Home
                    </button>
                </a>
            </div>

            <nav class = "topnav">
                <input type ="text" name ="searchBar" id="searchBar"  placeholder = "Search..">
                <input class = "change-grid-size" name = "gridSizeChange" type = "number" id = "gridSizeInput" placeholder = "change grid side ">
                
                <button id = "signUpBtn" class = "top-bar-btn">Sign Up</button>
                <button id = "LogInnBtn" class = "top-bar-btn">Log In</button>
                <button id = "logOutBtn" class = "top-bar-btn" style = "display:none">Log Out</button>

                <button type = "button" id = "continue-as-guest-btn-top-bar" class = "top-bar-btn">Continue as Guest</button>
                
                <section class ="items-category">  
                    <h2>Item Category</h2>
                    <!-- tab links-->
                    <button class = "tablinks" onclick = "switchCategory(event, 'Furniture')">Furniture</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Walls')">Walls</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Floors')">Floors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Doors')">Doors</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Windows')">Windows</button>
                    <button class = "tablinks" onclick = "switchCategory(event, 'Storage')">Storage</button>
                </section>
                <!-- category content -->
                <div class = 'item-category-content'>
                    <div id = "Furniture" class = "tabcontent"></div>
                    <div id = "Walls" class = "tabcontent"></div>
                    <div id = "Floors" class = "tabcontent"></div>
                    <div id = "Doors" class = "tabcontent"></div>
                    <div id = "Windows" class = "tabcontent"></div>
                    <div id = "Storage" class = "tabcontent"></div>
                </div>
                <div class = "floor-layer-changer">
                    <h2> Floor layer</h2>
                    <div class ="layer-toolbar">    
                        <button id = "moveUpFloorLayer">Move up</button>
                        <button id = "moveDownFloorLayer">Move down</button>
                        <button id = "addNewLayer">Add new layer</button>
                        <button id = "deleteLayer">Delete layer</button>
                    </div>

                    <div class = "Layer-list" id = "LayerList">
                        <div class = "Layer-list-item active" data-layer-index = "0">Layer 0</div>
                    </div>
                </div>

                <div class = "save-design-as-json"> 
                    <button id = "saveDesignButton" onclick="downloadBaseDesignAsJson()">Save Design as JSON</button>
                    <button id="loadDesignButton" onclick="loadBaseDesignFromJson()">
                        Load Design from JSON
                    </button>

                    <button id = "saveDesignToSupabaseButton" onclick="saveCurrentBaseDesignToSupabase()">
                        <img src = "../HUD_ICON/Cassette3.png" alt = "Save Design to Supabase" class = "HUD-icon-for-home-docs-infront">
                        Save Design Online
                    </button>
                    <button id = "exportAsPictureButton" onclick = "exportBaseDesignAsPicture()">
                        <img src = "../HUD_icon/CameraExpensive.png" alt = "Export Design as Picture" class = "HUD-icon-for-home-docs-infront">
                        Export as Image
                    </button>
                </div>
                
            </nav>
        </aside>


        <div class ='view-container'>
            <!--base design name-->
            <div class = 'base-design-name'>
                <h2 id = "designBaseName" contenteditable = "true">My Base</h2>
            </div>
            
            <div class = "iso-container" id = "grid"></div>
        </div>

        <nav class = "tools-bar">
                <button id = "rotateButton" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Rotate Tool" >
                    <img src = "../HUD_icon/Object_rotate_128.png">
                    <span class = "tool-text" style = "display: none;">Rotate</span>

                    <p class = "tool-description-text" style = "display: none;">
                        <img src = "../HUD_icon/Object_rotate_128.png" alt = "Rotate Tool" class = "tool-description-icon">
                        <strong>Rotate: </strong>You can routate the objects by clicking the rotate button . The object will rotate 90 degrees clockwise each time you click the button.
                    </p>
                </button>

                <video class = "tool-video-yt-source" data-owner = "rotateButton" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>
                <!--------------------------------------Seperate so easier to see the btn-->

                <button id = "deleteButton" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Delete Tool">
                    <img src = "../HUD_icon/Object_delete_128_96.png">
                    <span class = "tool-text" style = "display: none;">Delete</span>

                    <p class = "tool-description-text" style = "display: none;">
                        <img src = "../HUD_icon/Object_delete_128_96.png" alt = "Delete Tool" class = "tool-description-icon">
                        <strong>Delete: </strong>You can delete the objects by clicking the delete button. The object will be removed from the grid.
                    </p>
                </button>

                <video class = "tool-video-yt-source" data-owner = "deleteButton" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>

                <!--------------------------------------Seperate so easier to see the btn-->
                <button id = "undoButton" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Undo Tool">
                    Undos

                    <p class = "tool-description-text" style = "display: none;">
                        <strong>Undo: </strong>You can undo the last action by clicking the undo button. The last action will be reverted.
                    </p>
                </button>
                
                <video class = "tool-video-yt-source" data-owner = "undoButton" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>

                <!--------------------------------------Seperate so easier to see the btn-->

                <button id = "redoButton" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Redo Tool">
                    Redo
                    
                    <p class = "tool-description-text" style = "display: none;">
                        <strong>Redo: </strong>You can redo the last undone action by clicking the redo button. The last undone action will be reapplied.
                    </p>
                </button>

                <video class = "tool-video-yt-source" data-owner = "redoButton" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>

                <!--------------------------------------Seperate so easier to see the btn-->

                <button id = "placeButton" autofocus class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Place Tool">
                    <img src = "../HUD_icon/Object_place_128.png">
                    <span class = "tool-text" style = "display: none;">Place</span>

                    <p class = "tool-description-text" style = "display: none;">
                        <img src = "../HUD_icon/Object_place_128.png" alt = "Place Tool" class = "tool-description-icon">
                        <strong>Place: </strong>You can place the objects by clicking the place button. The object will be placed on the grid.
                    </p>
                </button>

                <video class = "tool-video-yt-source" data-owner = "placeButton" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>

                <!--------------------------------------Seperate so easier to see the btn-->

                <button id = "placeDirectionButton" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Place Direction Tool">Place Direction:</button>
                <video class = "tool-video-yt-source" data-owner = "placeDirectionButton" src = "d:\video\2026-08-02 22-47-36.mp4" autoplay loop muted style = "display: none;"></video>

                <!--------------------------------------Seperate so easier to see the btn-->

                <button id="hideObjectBtn" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Hide Object Tool">
                    <img src = "../HUD_icon/not_hide.png">
                    <span class = "tool-text" style = "display: none;">Hide Object</span>

                    <p class = "tool-description-text" style = "display: none;">
                        <img src = "../HUD_icon/not_hide.png" alt = "Hide Tool" class = "tool-description-icon">
                        <strong>Hide: </strong>You can hide the objects by clicking the hide button. The object will be hidden from view but not deleted.
                    </p>
                </button>
                <video class = "tool-video-yt-source" data-owner = "hideObjectBtn" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>

                <!--------------------------------------Seperate so easier to see the btn-->
                
                <button id = "unhideObjectBtn" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Unhide Object Tool">
                    <img src = "../HUD_icon/hidden.png">
                    <span class = "tool-text" style = "display: none;">Unhide Object</span>

                    <P class = "tool-description-text" style = "display: none;">
                        <img src = "../HUD_icon/hidden.png" alt = "Unhide Tool" class = "tool-description-icon">
                        <strong>Unhide: </strong>You can unhide the objects by clicking the unhide button. The object will be visible again.
                    </P>
                </button>
                <video class = "tool-video-yt-source" data-owner = "unhideObjectBtn" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>

                <!--------------------------------------Seperate so easier to see the btn-->
                <button id = "hide_grid_number_btn" class = "tool-tooltip-hover-show-tooltip" data-tool-name = "Hide Grid Numbers Tool">
                    <img src = "../HUD_icon/n.png">
                    <span class = "tool-text" style = "display: none;">Hide Grid Numbers</span>

                    <P class = "tool-description-text" style = "display: none;">
                        <img src = "../HUD_icon/n.png" alt = "Hide Grid Numbers Tool" class = "tool-description-icon">
                        <strong>Hide Grid Numbers: </strong>You can hide the grid numbers by clicking the hide grid numbers button. The grid numbers will be hidden from view.
                    </P>
                </button>
                <video class = "tool-video-yt-source" data-owner = "hide_grid_number_btn" src = "../feature_video/test.mp4" autoplay loop muted style = "display: none;"></video>
                <!--------------------------------------Seperate so easier to see the btn-->

        </nav>

        <div id = "tool-tooltip-box" class = "tool-tooltip-box">
            <p id = "tool-tooltip-name-text" class = "tool-tooltip-name-text"></p>
            <div id = "tool-tooltip-video-box" class = "tool-tooltip-video-box"></div>
            <p id = "tool-tooltip-text-description-for-that-tool" class = "tool-tooltip-text-description-for-that-tool"></p>
        </div>

        <div class = "login-signup-modal" id = "login-signup-modal">
            <div class = "auth-modal-box">
                <div class = "auth-modal-header">
                    <h2 id = "auth-modal-title">Log In</h2>
                    <button id = "close-auth-modal-btn" class = "close-auth-modal-btn">X</button>
                </div>

                <form id = "login-form" class = "auth-modal-form">

                    <label for = "user-name-input">Username</label>
                    <input type="text" id="user-name-input" placeholder="Enter your username" style = "display:none">

                    <label for="email-input">Email</label>
                    <input type="email" id="email-input" placeholder="you@example.com" required>

                    <label for = "password-input">Password</label>
                    <input type="password" id="password-input" placeholder="••••••••" required>

                    <div class = "auth-modal-password-row-text">
                        <label for = "password-input">Password</label>
                        <span id = "forgot-password-link">Forgot Password?</span>
                    </div>

                    <button type = "submit" id = "auth-modal-submit-btn">Log In With Email</button>
                    <button type = "button" id = "continue-as-guest-btn" class = "top-bar-btn">Continue as Guest</button>

                    <p id = "authMessage"></p>
                    <p class = "auth-modal-switch-mode-text">
                        <span id = "switch-to-signup">Don't have an account?</span>
                        <button type = "button" id = "switch-to-signup-btn">Sign Up</button>
                    </p>

                </form>
            </div>
        </div>

        <script src = "itemDatabase.js"></script>
        <script src = 'CameraView.js'></script>
        <script src = "Wall_placement.js"></script>
        <script src = 'btn_mouse_Ui_stuff.js'></script>
        <script src = "tools_bar_function.js"></script>
        <script src = "search_bar_items_list.js"></script>
        <script src = "cube.js"></script>
        <script src = "hide_unhide_object.js"></script>

        <script src = "FloorControllLayer.js"></script>
        <script src = "saveCurrentBaseDesignFor_loadExistingBaseDesign.js"></script>

        <script src = "sprite_with_data/floor/floorSpriteData.js"></script>

        <script src = "sprite_with_data/wall/Small_Wall_data_with_spirte.js"></script>
        <script src = "sprite_with_data/wall/Meddium_Wall_data_with_spirte.js"></script>
        <script src = "sprite_with_data/wall/Large_Wall_data_with_spirte.js"></script>

        <script src = "sprite_with_data/cube/cubeSpriteData.js"></script>

        <script src = "sprite_with_data/sprite_loader/wallSpriteLoader.js"></script>
        <script src = "sprite_with_data/sprite_loader/cubeSpriteLoader.js"></script>
        <script src = "sprite_with_data/sprite_loader/floorSpriteLoader.js"></script>
        
        <script src = "create_grid.js"></script>
        
        <script src="hide_grid_number.js"></script>

        <script src = "download_base_design.js"></script>
        <script src = "capture_design_as_picture_for_previewImg_card.js"></script>



        <script type="module" src="../sb_stuff/supabase_client.js"></script>
        <script type="module" src="../login/updateUserAvatarAsSignIN.js"></script>
        <script src = "../login/auth-sign-log-toggle.js"></script>

        <script src = "compress_image_for_preview.js"></script>
        <script src = "save_design_to_supabase.js"></script>
        <script src = "tool_tooltip-preview.js"></script>
    </body>
</html>
